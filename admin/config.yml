# Sveltia CMS — the editor at yoursite.com/admin
# After the GitHub repo exists, set `repo` to "your-github-username/repo-name".
backend:
  name: github
  repo: gizemakdag/gizemakdag-site
  branch: main

site_url: "https://gizemakdag.com"
display_url: "https://gizemakdag.com"
logo:
  src: /images/favicon.svg

media_folder: uploads
public_folder: /uploads

# Images are resized and converted to WebP in the browser before upload,
# so you can drop in full-size PNGs straight from Midjourney.
media_libraries:
  default:
    config:
      slugify_filename: true
      transformations:
        raster_image:
          format: webp
          quality: 86
          width: 2400
          height: 2400

collections:
  - name: work
    label: Projects
    files:
      - name: projects
        label: All projects
        file: content/projects.json
        format: json
        fields:
          - name: projects
            label: Projects
            label_singular: Project
            widget: list
            summary: "{{fields.title}} · {{fields.year}}"
            thumbnail: cover
            add_to_top: true
            collapsed: true
            hint: Drag to reorder. The order here is the order tears appear in.
            fields:
              - { name: title, label: Title, widget: string, hint: "The last word is set in italic on the project page." }
              - { name: cover, label: Cover image (shown inside the tear), widget: image }
              - name: tear_focus
                label: Which part of the cover shows in the tear
                widget: select
                default: center
                options:
                  - { label: Top, value: top }
                  - { label: Center, value: center }
                  - { label: Bottom, value: bottom }
              - { name: year, label: Year, widget: string, required: false }
              - { name: category, label: Medium / category, widget: string, required: false, hint: "e.g. AI photograph, Brand identity, Film" }
              - { name: client, label: Client / collaborator, widget: string, required: false }
              - { name: description, label: Description, widget: text, required: false }
              - name: images
                label: More images
                label_singular: Image
                widget: list
                required: false
                summary: "{{fields.caption}}"
                thumbnail: image
                fields:
                  - { name: image, label: "Image (for a video: its poster frame)", widget: image, required: false }
                  - { name: video, label: "Video (optional, MP4 under 90 MB)", widget: file, required: false }
                  - { name: caption, label: Caption, widget: string, required: false }
              - { name: link_label, label: External link text, widget: string, required: false, hint: "e.g. Watch the film" }
              - { name: link_url, label: External link URL, widget: string, required: false }
              - { name: hidden, label: Hide from the site, widget: boolean, default: false, required: false }

  - name: shop
    label: Store
    files:
      - name: store
        label: Store products
        file: content/store.json
        format: json
        fields:
          - { name: title, label: Tab name, widget: string, default: Store }
          - { name: intro, label: Intro line, widget: text, required: false }
          - { name: store_url, label: Default store link, widget: string, required: false, hint: "Used for products that have no link of their own." }
          - name: products
            label: Products
            label_singular: Product
            widget: list
            summary: "{{fields.title}} · {{fields.price}}"
            thumbnail: image
            add_to_top: true
            collapsed: true
            fields:
              - { name: title, label: Title, widget: string }
              - { name: price, label: Price, widget: string, required: false, hint: "e.g. $55" }
              - { name: image, label: Image, widget: image, required: false }
              - { name: url, label: Buy link, widget: string, required: false }
              - { name: hidden, label: Hide from the site, widget: boolean, default: false, required: false }

  - name: settings
    label: Site settings
    files:
      - name: site
        label: Profile, socials & contact
        file: content/site.json
        format: json
        fields:
          - { name: name, label: Name, widget: string }
          - { name: role, label: Role (browser tab title only), widget: string, required: false }
          - { name: hint, label: Homepage line, widget: string, required: false, hint: "Each sentence goes on its own line." }
          - { name: list_title, label: Project list heading, widget: string, required: false, default: "Falling now" }
          - { name: list_subtitle, label: Project list heading (dim part), widget: string, required: false, default: "up next" }
          - { name: nav_projects, label: Projects button text, widget: string, required: false, default: "Projects" }
          - { name: show_count, label: Show project count on that button, widget: boolean, required: false, default: false }
          - { name: nav_info, label: Info button text, widget: string, required: false, default: "Info" }
          - { name: about, label: About, widget: text, required: false }
          - { name: email, label: Contact email, widget: string, required: false }
          - { name: location, label: Location, widget: string, required: false }
          - name: socials
            label: Socials
            label_singular: Social
            widget: list
            summary: "{{fields.label}}"
            fields:
              - { name: label, label: Name, widget: string, hint: "e.g. Instagram" }
              - { name: url, label: URL, widget: string }
              - { name: homepage, label: Show on homepage, widget: boolean, default: true, required: false, hint: "Off = only listed on the Info page" }
          - { name: clients_title, label: Clients heading, widget: string, required: false, default: "Clients" }
          - name: clients
            label: Clients (logos)
            label_singular: Client
            widget: list
            required: false
            summary: "{{fields.name}}"
            fields:
              - { name: name, label: Name, widget: string }
              - { name: logo, label: "Logo (cream/white on transparent PNG, WebP or SVG)", widget: image }
              - { name: height, label: "Logo height in px (optional, default 30)", widget: number, required: false }
              - { name: url, label: Link (optional), widget: string, required: false }
          - { name: explorations_title, label: AI explorations heading, widget: string, required: false, default: "AI explorations" }
          - name: explorations
            label: AI explorations (collab videos)
            label_singular: Video
            widget: list
            required: false
            summary: "{{fields.title}}"
            fields:
              - { name: title, label: Title, widget: string }
              - { name: video, label: "Video (vertical MP4, under 90 MB)", widget: file }
              - { name: poster, label: "Poster image (optional)", widget: image, required: false }
              - { name: collab, label: "Collab with (e.g. @name)", widget: string, required: false }
              - { name: collab_url, label: "Collab link (optional)", widget: string, required: false }
          - name: links
            label: Other links
            label_singular: Link
            widget: list
            required: false
            summary: "{{fields.label}}"
            fields:
              - { name: label, label: Label, widget: string }
              - { name: url, label: URL, widget: string }
